name: Build Native Libraries & NuGet Package

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config build-essential git \
            libssl-dev libcurl4-openssl-dev libxml2-dev libusb-1.0-0-dev \
            patchelf

      - name: Build upstream native libraries (linux-x64)
        run: |
          set -euo pipefail
          PREFIX="$PWD/native-build/linux-x64"
          SRC="$PWD/native-src"
          mkdir -p "$PREFIX" "$SRC"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib -Wl,-rpath,\$ORIGIN"
          NPROC=$(nproc)

          build_repo() {
            local name="$1"
            shift
            echo "=== Building $name ==="
            git clone --depth 1 "https://github.com/libimobiledevice/${name}.git" "$SRC/$name"
            pushd "$SRC/$name"
            ./autogen.sh --prefix="$PREFIX" --disable-static --enable-shared "$@"
            make -j"$NPROC"
            make install
            popd
          }

          build_repo libplist --without-cython
          build_repo libimobiledevice-glue
          build_repo libusbmuxd
          build_repo libtatsu
          build_repo libimobiledevice --without-cython
          build_repo libirecovery
          build_repo libideviceactivation

          STAGE="$PWD/artifacts/libimobiledevice/linux-x64/lib"
          STAGE_BIN="$PWD/artifacts/libimobiledevice/linux-x64/bin"
          mkdir -p "$STAGE" "$STAGE_BIN"
          for f in "$PREFIX"/lib/*.so.[0-9] "$PREFIX"/lib/*.so.[0-9][0-9]; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            [[ "$base" == libplist++* ]] && continue
            cp -L "$f" "$STAGE/$base"
          done
          for f in "$PREFIX"/bin/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            cp -L "$f" "$STAGE_BIN/$(basename "$f")"
          done
          for f in "$STAGE"/*.so* "$STAGE_BIN"/*; do
            [ -f "$f" ] && patchelf --set-rpath '$ORIGIN' "$f" || true
          done
          ls -la "$STAGE" "$STAGE_BIN"
          LD_LIBRARY_PATH="$STAGE" "$STAGE_BIN/idevice_id" --version
          LD_LIBRARY_PATH="$STAGE" "$STAGE_BIN/ideviceimagemounter" --version

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and run native smoke tests (linux-x64)
        env:
          DOTNET_ROLL_FORWARD: Major
          IMOBILEDEVICE_RUN_NATIVE_SMOKE: "1"
        run: |
          dotnet build iMobileDevice.Tests/iMobileDevice.Tests.csproj -c Release
          cp -f artifacts/libimobiledevice/linux-x64/lib/*.so* iMobileDevice.Tests/bin/Release/netcoreapp3.0/
          export LD_LIBRARY_PATH="$PWD/artifacts/libimobiledevice/linux-x64/lib:${LD_LIBRARY_PATH:-}"
          dotnet test iMobileDevice.Tests/iMobileDevice.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~UpstreamSyncTests|FullyQualifiedName~HandleTests|FullyQualifiedName~NativeSmokeTests"

      - name: Upload linux-x64 native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/libimobiledevice/linux-x64

  build-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-readline

      - name: Build upstream native libraries (win-x64)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          PREFIX="$PWD/native-build/win-x64"
          SRC="$PWD/native-src"
          mkdir -p "$PREFIX" "$SRC"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:/mingw64/lib/pkgconfig"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"
          export PATH="$PREFIX/bin:$PATH"
          NPROC=$(nproc)

          build_repo() {
            local name="$1"
            shift
            echo "=== Building $name ==="
            git clone --depth 1 "https://github.com/libimobiledevice/${name}.git" "$SRC/$name"
            pushd "$SRC/$name"
            ./autogen.sh --prefix="$PREFIX" --disable-static --enable-shared "$@"
            make -j"$NPROC"
            make install
            popd
          }

          build_repo libplist --without-cython
          build_repo libimobiledevice-glue
          build_repo libusbmuxd
          build_repo libtatsu
          build_repo libimobiledevice --without-cython
          build_repo libirecovery
          build_repo libideviceactivation

          STAGE="$PWD/artifacts/libimobiledevice/win-x64/bin"
          mkdir -p "$STAGE"
          cp -f "$PREFIX"/bin/*.dll "$STAGE/"
          cp -f "$PREFIX"/bin/*.exe "$STAGE/"

          # Collect transitive MinGW64 runtime DLL dependencies (for both DLLs and CLI tools)
          for pass in 1 2 3; do
            for bin in "$STAGE"/*.dll "$STAGE"/*.exe; do
              [ -f "$bin" ] || continue
              ldd "$bin" | awk '/\/mingw64\/bin\// { print $3 }' | while read -r dep; do
                [ -f "$dep" ] && cp -n "$dep" "$STAGE/" || true
              done
            done
          done

          ls -la "$STAGE"
          "$STAGE/idevice_id.exe" --version
          "$STAGE/ideviceimagemounter.exe" --version

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and run native smoke tests (win-x64)
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
          IMOBILEDEVICE_RUN_NATIVE_SMOKE: "1"
        run: |
          dotnet build iMobileDevice.Tests/iMobileDevice.Tests.csproj -c Release
          Copy-Item -Force "artifacts/libimobiledevice/win-x64/bin/*.dll" "iMobileDevice.Tests/bin/Release/netcoreapp3.0/"
          dotnet test iMobileDevice.Tests/iMobileDevice.Tests.csproj -c Release --no-build `
            --filter "FullyQualifiedName~UpstreamSyncTests|FullyQualifiedName~HandleTests|FullyQualifiedName~NativeSmokeTests"

      - name: Upload win-x64 native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: artifacts/libimobiledevice/win-x64

  build-osx-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool pkg-config openssl@3

      - name: Build upstream native libraries (osx-arm64)
        run: |
          set -euo pipefail
          PREFIX="$PWD/native-build/osx-arm64"
          SRC="$PWD/native-src"
          mkdir -p "$PREFIX" "$SRC"

          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          SDK=$(xcrun --show-sdk-path)
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$OPENSSL_PREFIX/lib/pkgconfig"
          export CPPFLAGS="-I$PREFIX/include -I$OPENSSL_PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib -L$OPENSSL_PREFIX/lib -Wl,-rpath,@loader_path"
          export libcurl_CFLAGS="-I$SDK/usr/include"
          export libcurl_LIBS="-lcurl"
          export libxml2_CFLAGS="-I$SDK/usr/include/libxml2"
          export libxml2_LIBS="-lxml2"
          NPROC=$(sysctl -n hw.ncpu)

          build_repo() {
            local name="$1"
            shift
            echo "=== Building $name ==="
            git clone --depth 1 "https://github.com/libimobiledevice/${name}.git" "$SRC/$name"
            pushd "$SRC/$name"
            ./autogen.sh --prefix="$PREFIX" --disable-static --enable-shared "$@"
            make -j"$NPROC"
            make install
            popd
          }

          build_repo libplist --without-cython
          build_repo libimobiledevice-glue
          build_repo libusbmuxd
          build_repo libtatsu
          build_repo libimobiledevice --without-cython
          build_repo libirecovery
          build_repo libideviceactivation

          STAGE="$PWD/artifacts/libimobiledevice/osx-arm64/lib"
          STAGE_BIN="$PWD/artifacts/libimobiledevice/osx-arm64/bin"
          mkdir -p "$STAGE" "$STAGE_BIN"

          for f in "$PREFIX"/lib/*.[0-9].dylib "$PREFIX"/lib/*.[0-9][0-9].dylib; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            [[ "$base" == libplist++* ]] && continue
            cp -L "$f" "$STAGE/$base"
          done
          cp -L "$OPENSSL_PREFIX/lib/libssl.3.dylib" "$STAGE/libssl.3.dylib"
          cp -L "$OPENSSL_PREFIX/lib/libcrypto.3.dylib" "$STAGE/libcrypto.3.dylib"

          for f in "$PREFIX"/bin/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            cp -L "$f" "$STAGE_BIN/$(basename "$f")"
          done

          # Rewrite install names to @rpath and ad-hoc re-sign for Apple Silicon relocatability
          for f in "$STAGE"/*.dylib "$STAGE_BIN"/*; do
            [ -f "$f" ] || continue
            chmod u+w "$f"
            base=$(basename "$f")
            if [[ "$f" == *.dylib ]]; then
              install_name_tool -id "@rpath/$base" "$f"
            fi
            install_name_tool -add_rpath "@loader_path" "$f" 2>/dev/null || true
            if [[ "$f" == "$STAGE_BIN/"* ]]; then
              install_name_tool -add_rpath "@loader_path/../lib" "$f" 2>/dev/null || true
            fi
            otool -L "$f" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                "$PREFIX"/*|"$OPENSSL_PREFIX"/*|/opt/homebrew/*)
                  dep_base=$(basename "$dep")
                  if [ -f "$STAGE/$dep_base" ]; then
                    install_name_tool -change "$dep" "@rpath/$dep_base" "$f"
                  fi
                  ;;
              esac
            done
            codesign --force --sign - "$f"
          done

          ls -la "$STAGE" "$STAGE_BIN"
          "$STAGE_BIN/idevice_id" --version
          "$STAGE_BIN/ideviceimagemounter" --version

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and run native smoke tests (osx-arm64)
        env:
          DOTNET_ROLL_FORWARD: Major
          IMOBILEDEVICE_RUN_NATIVE_SMOKE: "1"
        run: |
          dotnet build iMobileDevice.Tests/iMobileDevice.Tests.csproj -c Release
          cp -f artifacts/libimobiledevice/osx-arm64/lib/*.dylib iMobileDevice.Tests/bin/Release/netcoreapp3.0/
          dotnet test iMobileDevice.Tests/iMobileDevice.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~UpstreamSyncTests|FullyQualifiedName~HandleTests|FullyQualifiedName~NativeSmokeTests" \
            -- RunConfiguration.TargetPlatform=ARM64

      - name: Upload osx-arm64 native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-osx-arm64
          path: artifacts/libimobiledevice/osx-arm64

  pack-nuget:
    needs: [ build-linux-x64, build-win-x64, build-osx-arm64 ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download linux-x64 native binaries
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native-artifacts/libimobiledevice/linux-x64

      - name: Download win-x64 native binaries
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: native-artifacts/libimobiledevice/win-x64

      - name: Download osx-arm64 native binaries
        uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: native-artifacts/libimobiledevice/osx-arm64

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet package
        shell: pwsh
        run: |
          $env:SYSTEM_ARTIFACTSDIRECTORY = "$PWD/native-artifacts"
          dotnet pack iMobileDevice-net/iMobileDevice-net.csproj -c Release -o nupkg
          Get-ChildItem nupkg

      - name: Inspect NuGet contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg = Get-ChildItem nupkg/*.nupkg | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $zip.Entries | Where-Object { $_.FullName -like 'runtimes/*' -or $_.FullName -like 'lib/*' } | Select-Object -ExpandProperty FullName
          $zip.Dispose()

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: imobiledevice-net-nupkg
          path: nupkg/*.nupkg
